<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DG PREDICTION HUB</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#020805;
  font-family:Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 14px;
}

/* MAIN CARD */

.card{
  width:100%;
  max-width:430px;
  min-height:720px;
  padding:55px 28px 40px;
  text-align:center;

  background:#03140b;

  border:1px solid #59651e;
  border-radius:28px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    0 0 35px rgba(70,120,30,.08);

  position:relative;
  overflow:hidden;
}

/* subtle top glow */

.card:before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:#39772d;
  filter:blur(110px);
  opacity:.12;
  top:-100px;
  left:50%;
  transform:translateX(-50%);
}

/* DG BADGE */

.logo{
  position:relative;

  width:145px;
  height:145px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #174b29 0%,
      #082414 65%,
      #031008 100%
    );

  border:5px solid #6f8d2c;

  box-shadow:
    0 0 0 5px rgba(110,140,40,.08),
    0 0 25px rgba(110,150,45,.22);
}

.logo span{
  font-family:Georgia,serif;
  font-size:47px;
  font-weight:bold;
  letter-spacing:3px;
  color:#e5bf38;

  text-shadow:0 2px 8px rgba(0,0,0,.5);
}

/* TITLE */

.title{
  position:relative;

  margin-top:38px;

  font-family:Georgia,serif;
  font-size:36px;
  line-height:1.15;
  letter-spacing:2px;

  color:#e4bd35;

  text-shadow:
    0 2px 10px rgba(0,0,0,.5);
}

/* DIVIDER */

.divider{
  width:110px;
  height:4px;

  margin:24px auto;

  border-radius:10px;

  background:#b49a29;
}

/* MAIN TEXT */

.heading{
  font-size:20px;
  font-weight:700;
  margin-top:5px;
}

.subtitle{
  margin-top:17px;

  color:#9daf9f;

  font-size:16px;
  font-weight:600;

  line-height:1.5;
}

/* TELEGRAM BUTTON */

.join{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;

  margin-top:43px;

  padding:20px 15px;

  border-radius:15px;

  text-decoration:none;

  color:#fff;

  background:#075c2e;

  border:1px solid #197a42;

  box-shadow:
    0 8px 22px rgba(0,100,45,.25);

  font-family:Georgia,serif;

  font-size:21px;
  font-weight:bold;

  letter-spacing:2px;

  transition:.2s;
}

.join:hover{
  transform:translateY(-2px);
  background:#086b36;
}

.telegram{
  width:27px;
  height:27px;

  margin-right:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fff;

  color:#08763b;

  font-family:Arial;
  font-size:15px;
  font-weight:bold;
}

.arrow{
  margin-left:12px;
  color:#e5bf38;
  font-size:24px;
}

/* NOTE */

.note{
  margin-top:25px;

  color:#84958a;

  font-size:13px;
  font-weight:600;
}

/* FOOTER */

.footer{
  margin-top:52px;

  padding-top:20px;

  border-top:1px solid rgba(180,160,50,.13);

  color:#65756b;

  font-size:10px;

  letter-spacing:1px;
}

/* MOBILE */

@media(max-width:380px){

  .card{
    padding:42px 20px 30px;
    min-height:650px;
  }

  .logo{
    width:125px;
    height:125px;
  }

  .logo span{
    font-size:39px;
  }

  .title{
    font-size:31px;
  }

  .heading{
    font-size:18px;
  }

  .subtitle{
    font-size:14px;
  }

  .join{
    font-size:18px;
  }

}

/* NEON EFFECTS */

.card{
  animation:cardGlow 4s ease-in-out infinite;
}

@keyframes cardGlow{
  0%,100%{
    box-shadow:
      0 20px 60px rgba(0,0,0,.65),
      0 0 20px rgba(80,150,40,.08);
  }
  50%{
    box-shadow:
      0 20px 60px rgba(0,0,0,.65),
      0 0 40px rgba(100,180,50,.22);
  }
}

/* LOGO NEON */

.logo{
  animation:logoNeon 2.8s ease-in-out infinite;
}

@keyframes logoNeon{
  0%,100%{
    box-shadow:
      0 0 0 5px rgba(110,140,40,.08),
      0 0 22px rgba(110,150,45,.25);
  }
  50%{
    box-shadow:
      0 0 0 7px rgba(160,190,50,.10),
      0 0 42px rgba(160,200,55,.50);
  }
}

/* TITLE GLOW */

.title{
  animation:titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow{
  0%,100%{
    text-shadow:0 0 5px rgba(230,190,45,.15);
  }
  50%{
    text-shadow:
      0 0 10px rgba(230,190,45,.55),
      0 0 25px rgba(230,190,45,.25);
  }
}

/* BUTTON NEON */

.join{
  animation:buttonNeon 2s ease-in-out infinite;
}

@keyframes buttonNeon{
  0%,100%{
    box-shadow:
      0 8px 22px rgba(0,100,45,.25);
  }
  50%{
    box-shadow:
      0 8px 30px rgba(0,150,65,.50),
      0 0 22px rgba(0,150,65,.25);
  }
}</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <span>DG</span>
  </div>

  <div class="title">
    DG PREDICTION HUB
  </div>

  <div class="divider"></div>

  <div class="heading">
    Join To Get Premium Access
  </div>

  <div class="subtitle">
    Get Daily Exclusive Insights ✨
  </div>

  <a
    href="https://t.me/+RHpBZ0uYlfVjZWZl"
    target="_blank"
    class="join"
  >

    <span class="telegram">➤</span>

    JOIN TELEGRAM

    <span class="arrow">➤</span>

  </a>

  <div class="note">
    Tap to open Telegram and join instantly
  </div>

  <div class="footer">
    DG PREDICTION HUB • PREMIUM COMMUNITY
  </div>

</div>

</body>
  </html>
