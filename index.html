<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DG PREDICTION HUB</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#020806;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px 12px;
}

/* MAIN CARD */

.card{
  width:100%;
  max-width:430px;
  min-height:720px;
  padding:45px 25px 35px;
  text-align:center;
  border-radius:30px;

  background:
    radial-gradient(circle at 50% 20%,
    rgba(39,120,58,.13),
    transparent 35%),
    #03130b;

  border:1px solid rgba(177,190,36,.55);

  box-shadow:
    0 0 35px rgba(100,160,50,.08),
    inset 0 0 40px rgba(0,0,0,.3);
}

/* DG BADGE */

.logo{
  width:150px;
  height:150px;
  margin:auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;
  font-weight:900;
  letter-spacing:3px;

  color:#f1c735;

  background:
    radial-gradient(circle,#183f25,#071b10);

  border:5px solid #668c2c;

  box-shadow:
    0 0 20px rgba(145,190,55,.25),
    inset 0 0 20px rgba(0,0,0,.5);
}

/* TITLE */

h1{
  margin-top:38px;

  font-family:Georgia,serif;
  font-size:39px;
  line-height:1.15;
  letter-spacing:2px;

  color:#e6bd32;

  text-shadow:0 0 15px rgba(220,180,40,.12);
}

/* DIVIDER */

.line{
  width:115px;
  height:4px;
  margin:25px auto;

  border-radius:10px;
  background:#b69a25;

  box-shadow:0 0 10px rgba(200,170,40,.3);
}

/* TEXT */

.heading{
  font-size:20px;
  font-weight:800;
  margin-top:10px;
}

.sub{
  margin-top:18px;

  color:#a9b9ad;
  font-size:17px;
  font-weight:600;
  line-height:1.6;
}

/* BUTTON */

.join{
  display:block;

  width:100%;
  margin-top:48px;
  padding:21px 15px;

  border-radius:15px;

  text-decoration:none;
  color:#fff;

  font-family:Georgia,serif;
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;

  background:linear-gradient(
    135deg,
    #0b6433,
    #075b2e
  );

  border:1px solid #19824a;

  box-shadow:
    0 8px 25px rgba(0,100,45,.28);

  transition:.25s;
}

.join:hover{
  transform:translateY(-3px);
  box-shadow:
    0 12px 35px rgba(0,140,65,.4);
}

.arrow{
  color:#e8c53c;
  font-size:28px;
  margin-left:10px;
}

/* SMALL TEXT */

.note{
  margin-top:25px;

  color:#87998d;
  font-size:14px;
  font-weight:600;
}

/* BOTTOM */

.bottom{
  margin-top:55px;

  padding-top:22px;

  border-top:1px solid rgba(180,180,50,.15);

  color:#66766b;
  font-size:11px;
  letter-spacing:1px;
}

@media(max-width:380px){

  .card{
    min-height:650px;
    padding:35px 20px;
  }

  .logo{
    width:125px;
    height:125px;
    font-size:35px;
  }

  h1{
    font-size:32px;
  }

  .heading{
    font-size:18px;
  }

  .sub{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    DG
  </div>

  <h1>
    DG PREDICTION HUB
  </h1>

  <div class="line"></div>

  <div class="heading">
    Join To Get Premium Access
  </div>

  <div class="sub">
    Get Daily Exclusive Insights ✨
  </div>

  <a
    href="https://t.me/+RHpBZ0uYlfVjZWZl"
    target="_blank"
    class="join"
  >
    JOIN TELEGRAM
    <span class="arrow">➤</span>
  </a>

  <div class="note">
    Tap to open Telegram and join instantly
  </div>

  <div class="bottom">
    DG PREDICTION HUB • PREMIUM COMMUNITY
  </div>

</div>

</body>
</html>
